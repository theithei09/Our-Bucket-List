
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMARO'S Bucket List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
<!-- INTRO / FRONT PAGE -->
<section class="intro-screen" id="introScreen">
    <div class="intro-card">
        <div class="intro-decoration">♡ ✧ ☕ ✧ ♡</div>

        <p class="intro-small">A LITTLE BOOK OF MEMORIES DEC 2026</p>

        <h1>Bucket List</h1>

        <p class="intro-quote">
            "Life is short, make every moment count."
        </p>

        <div class="intro-line"></div>

        <p class="intro-description">
            A collection of joy, laughter, stories, jokes
            and experience with people i feel loved.
        </p>

        <button class="start-button" onclick="startJourney()">
            Start Our Memory
        </button>

        <p class="intro-footer">🤎 Made With Love 🤎</p>
    </div>
</section>


<div class="container">
    <h1>Bucket List</h1>
    <p class="subtitle">Turning a simple day into a special memory</p></p>

    <div class="bucket-list" id="bucketList"></div>

    <p class="footer"> One memory at a time </p>
</div>


<script>
const goals = [
    "Play large Tongits Cards",
    "Make our own Handshake",
    "Paly UNO No Mercy",
    "Experience and enjoy Tin-tin Baka again",
    "Letter to ourselves 5 years from now",
    "Fishing",
    "Blindfold Baking",
    "Canvas Painting",
    "Air-dry Clay",
    "Play Charades",
    "Camping with Filming and Picnic",
    "Play (Woul You Rather?)",
    "Aningalan Trip with Kuyas",
    "Watch at least 3 Horror Movies at night"
];

const STORAGE_KEY = "myBrownBucketList_v1";
const list = document.getElementById("bucketList");

// Load saved progress
function loadProgress() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        const data = saved ? JSON.parse(saved) : {};

        if (!data || typeof data !== "object" ||
            Array.isArray(data)) return {};

        return data;
    } catch (error) {
        alert("Saved data could not be read.");
        return {};
    }
}

let progress = loadProgress();

// Save changes automatically
function saveProgress() {
    try {
        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(progress)
        );
    } catch (error) {
        alert(
            "Your browser storage is full. " +
            "Try removing some photos before uploading more."
        );
    }
}

// Create the bucket list
goals.forEach((goal, index) => {
    const card = document.createElement("div");
    card.className = "goal-card";

    const saved = progress[index] || {
        checked: false,
        photos: ["", "", ""]
    };

    if (!Array.isArray(saved.photos)) {
        saved.photos = ["", "", ""];
    }

    while (saved.photos.length < 3) {
        saved.photos.push("");
    }

    card.innerHTML = `
        <label class="goal-title">
            <input type="checkbox" class="goal-check">
            <span class="custom-check">✓</span>
            <span class="goal-name"></span>
        </label>

        <div class="photos">
            ${[0, 1, 2].map((n) => `
                <div class="photo-slot">
                    <input type="file"
                           accept="image/*"
                           class="photo-input"
                           aria-label="Upload photo ${n + 1}">
                    <span class="upload-text">
                        ＋<br>Photo ${n + 1}
                    </span>
                    <img class="preview" alt="Bucket list photo">
                    <button type="button"
                            class="remove-photo"
                            aria-label="Remove photo ${n + 1}">
                        ×
                    </button>
                </div>
            `).join("")}
        </div>
    `;

    card.querySelector(".goal-name").textContent = goal;

    const checkbox = card.querySelector(".goal-check");
    checkbox.checked = saved.checked === true;

    function updateCard() {
        card.classList.toggle("completed", checkbox.checked);
    }

    updateCard();

    // Save checkbox changes
    checkbox.addEventListener("change", () => {
        saved.checked = checkbox.checked;
        progress[index] = saved;
        saveProgress();
        updateCard();

        if (checkbox.checked) {
            const emojis = ["🤎", "✨", "🫶", "🎉", "⭐"];

            for (let i = 0; i < 12; i++) {
                const heart = document.createElement("span");
                heart.className = "confetti";
                heart.textContent =
                    emojis[Math.floor(Math.random() * emojis.length)];

                heart.style.left = Math.random() * 90 + "%";
                heart.style.setProperty(
                    "--drift",
                    (Math.random() * 100 - 50) + "px"
                );

                card.appendChild(heart);
                heart.addEventListener("animationend", () => {
                    heart.remove();
                });
            }
        }
    });

    const slots = card.querySelectorAll(".photo-slot");

    slots.forEach((slot, photoIndex) => {
        const input = slot.querySelector(".photo-input");
        const preview = slot.querySelector(".preview");
        const removeButton = slot.querySelector(".remove-photo");

        function showPhoto(dataURL) {
            if (dataURL) {
                preview.src = dataURL;
                slot.classList.add("has-photo");
            } else {
                preview.removeAttribute("src");
                slot.classList.remove("has-photo");
                input.value = "";
            }
        }

        // Restore saved photo
        showPhoto(saved.photos[photoIndex]);

        // Upload and save a photo
        input.addEventListener("change", () => {
            const file = input.files[0];
            if (!file) return;

            if (!file.type.startsWith("image/")) {
                alert("Please choose an image.");
                input.value = "";
                return;
            }

            // Limit each image to 1 MB to help prevent storage issues
            if (file.size > 1024 * 1024) {
                alert("Please choose a photo smaller than 1 MB.");
                input.value = "";
                return;
            }

            const reader = new FileReader();

            reader.onload = event => {
                const dataURL = event.target.result;

                saved.photos[photoIndex] = dataURL;
                progress[index] = saved;

                try {
                    localStorage.setItem(
                        STORAGE_KEY,
                        JSON.stringify(progress)
                    );

                    showPhoto(dataURL);
                } catch (error) {
                    saved.photos[photoIndex] = "";
                    input.value = "";
                    alert(
                        "Not enough browser storage. " +
                        "Remove some photos and try again."
                    );
                }
            };

            reader.readAsDataURL(file);
        });

        // Remove a photo if you made a mistake
        removeButton.addEventListener("click", () => {
            saved.photos[photoIndex] = "";
            progress[index] = saved;
            saveProgress();
            showPhoto("");
        });
    });

    list.appendChild(card);
});

// Intro screen button
function startJourney() {
    document.getElementById("introScreen").classList.add("hide");
    document.body.classList.add("journey-started");
}
</script>


</body>
</html>
